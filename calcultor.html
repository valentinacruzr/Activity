<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora HU-1</title>
</head>
<body>
    <h1>Calculadora Básica</h1>
    
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <select id="operacion">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <button id="calcular">Calcular</button>

    <h2>Resultado:</h2>
    <p id="resultado"></p>

    <h2>Historial:</h2>
    <ul id="historial"></ul>

    <script>
        const historial = [];

        document.getElementById("calcular").addEventListener("click", () => {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);
            const op = document.getElementById("operacion").value;
            let resultado;

            if (op === "+") resultado = num1 + num2;
            else if (op === "-") resultado = num1 - num2;
            else if (op === "*") resultado = num1 * num2;
            else if (op === "/") resultado = num2 !== 0 ? num1 / num2 : "Error: División por cero";
            else resultado = "Operación no válida";

            document.getElementById("resultado").textContent = resultado;
            historial.push(`${num1} ${op} ${num2} = ${resultado}`);

            const lista = document.getElementById("historial");
            lista.innerHTML = "";
            historial.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                lista.appendChild(li);
            });
        });
    </script>
</body>
</html>
