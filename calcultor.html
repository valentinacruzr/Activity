<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora HU-2</title>
</head>
<body>
    <h1>Calculadora Básica HU-2</h1>
    <p>Operaciones: + - * /</p>
    
    <input type="text" id="num1" placeholder="Número 1">
    <input type="text" id="num2" placeholder="Número 2">
    <select id="operacion">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <button id="calcular">Calcular</button>
    <button id="limpiar">Limpiar historial</button>

    <h2>Resultado:</h2>
    <p id="resultado"></p>

    <h2>Historial:</h2>
    <ul id="historial"></ul>

    <script>
        const historial = [];

        function actualizarHistorial() {
            const lista = document.getElementById("historial");
            lista.innerHTML = "";
            historial.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                lista.appendChild(li);
            });
        }

        document.getElementById("calcular").addEventListener("click", () => {
            const n1 = document.getElementById("num1").value;
            const n2 = document.getElementById("num2").value;
            const num1 = parseFloat(n1);
            const num2 = parseFloat(n2);
            const op = document.getElementById("operacion").value;

            if (isNaN(num1) || isNaN(num2)) {
                alert("Ingrese números válidos");
                return;
            }

            let resultado;
            if (op === "+") resultado = num1 + num2;
            else if (op === "-") resultado = num1 - num2;
            else if (op === "*") resultado = num1 * num2;
            else if (op === "/") resultado = num2 !== 0 ? num1 / num2 : "Error: División por cero";
            else resultado = "Operación no válida";

            document.getElementById("resultado").textContent = resultado;
            historial.push(`${num1} ${op} ${num2} = ${resultado}`);
            actualizarHistorial();
        });

        document.getElementById("limpiar").addEventListener("click", () => {
            historial.length = 0;
            actualizarHistorial();
        });
    </script>
</body>
</html>
